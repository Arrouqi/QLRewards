<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qatar Living – Deals</title>
  <meta name="apple-itunes-app" content="app-id=961568535, app-argument=ql://RewardsScreen" />
  <meta name="google-play-app" content="app-id=com.qatarliving.classifieds" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{--bg:#0d1117;--accent:#e8b84b;--text:#f0f6fc;--muted:#8b949e;}
    html,body{height:100%;}
    body{display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);padding:24px;}
    .wrap{text-align:center;}
    .logo{width:64px;height:64px;border-radius:16px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:1.7rem;margin-bottom:18px;box-shadow:0 0 0 6px rgba(232,184,75,.15);}
    h1{font-size:1.1rem;font-weight:600;margin-bottom:6px;}
    p{font-size:.85rem;color:var(--muted);}
    .spinner{width:32px;height:32px;border:3px solid #30363d;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:18px auto 0;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">🏷️</div>
    <h1>Opening Qatar Living…</h1>
    <p>Taking you to the Deals.</p>
    <div class="spinner"></div>
  </div>

  <script>
    var DEEP_LINK   = 'ql://RewardsScreen';
    var ANDROID_URL = 'https://play.google.com/store/apps/details?id=com.qatarliving.classifieds&hl=en-US';
    var IOS_URL     = 'https://apps.apple.com/us/app/qatar-living/id961568535';
    // Mobile-only link: desktop visitors are sent to the Apple App Store
    // (instead of the website) so this link only ever leads to the app/store.
    var DESKTOP_URL = IOS_URL;
    var FALLBACK_MS = 1500;

    var ua        = navigator.userAgent || '';
    var isIOS     = /iphone|ipad|ipod/i.test(ua);
    var isAndroid = /android/i.test(ua);
    var platform  = isIOS ? 'ios' : (isAndroid ? 'android' : 'desktop');

    // ---- Persistent visitor id (per browser) for unique-user counting ----
    var visitorId = null;
    try {
      visitorId = localStorage.getItem('qld_visitor_id');
      if (!visitorId) {
        visitorId = (window.crypto && window.crypto.randomUUID)
          ? window.crypto.randomUUID()
          : 'v-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
        localStorage.setItem('qld_visitor_id', visitorId);
      }
    } catch (_) { /* private mode, no storage — ignore */ }

    // ---- Fire-and-forget analytics beacon ----
    function track(outcome) {
      try {
        var payload = JSON.stringify({
          visitorId: visitorId,
          platform: platform,
          outcome: outcome,
          pagePath: location.pathname,
          linkType: 'deals-mobile'
        });
        if (navigator.sendBeacon) {
          var blob = new Blob([payload], { type: 'application/json' });
          navigator.sendBeacon('/api/track/ql-deals', blob);
        } else {
          fetch('/api/track/ql-deals', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payload,
            keepalive: true
          }).catch(function () {});
        }
      } catch (_) { /* never let tracking break the redirect */ }
    }

    if (!isIOS && !isAndroid) {
      // Desktop → Apple App Store (this link never goes to the website)
      track('store');
      window.location.replace(DESKTOP_URL);
    } else {
      var storeUrl = isIOS ? IOS_URL : ANDROID_URL;

      // We always log "app_attempt" — if the timer fires, we then log "store"
      track('app_attempt');

      var t = setTimeout(function () {
        track('store');
        window.location.replace(storeUrl);
      }, FALLBACK_MS);

      document.addEventListener('visibilitychange', function () {
        if (document.hidden) clearTimeout(t);
      });
      window.addEventListener('pagehide', function () { clearTimeout(t); });
      window.addEventListener('blur',     function () { clearTimeout(t); });

      // Fire the deep link
      window.location.href = DEEP_LINK;
    }
  </script>
</body>
</html>
