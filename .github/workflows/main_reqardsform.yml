# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - reqardsform

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present
          BACKOFFICE_TARGET=qa BACKOFFICE_DRY_RUN=true node --import tsx --test server/backoffice/*.test.ts
          BACKOFFICE_TARGET=production BACKOFFICE_DRY_RUN=true NODE_ENV=test node --import tsx --test server/backoffice/production.test.ts

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  preflight:
    name: Check external production schema (read-only)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - uses: actions/download-artifact@v4
        with:
          name: node-app
      - name: Verify preflight safeguards
        run: node --test script/check-backoffice-schema.test.mjs
      - name: Verify required production columns without changing data
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: node script/check-backoffice-schema.mjs

  deploy:
    runs-on: ubuntu-latest
    needs: [build, preflight]

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'reqardsform'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_CECD9830B06943A7BA2FC265F228D598 }}