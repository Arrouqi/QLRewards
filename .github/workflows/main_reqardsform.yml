name: Build and deploy Node.js app to Azure Web App - reqardsform

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never overlap deployments or cancel an active database migration.
concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  migrate:
    name: Verify and apply deal-order migration
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Test migration safeguards
        run: node --test script/migrate-deal-order.test.mjs

      - name: Apply only the saved-deal ordering migration
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: node script/migrate-deal-order.mjs

  deploy:
    runs-on: ubuntu-latest
    needs: [build, migrate]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'reqardsform'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_CECD9830B06943A7BA2FC265F228D598 }}
